name: Daily AI YouTube Uploader

on:
  schedule:
    # Runs at 22:30 UTC every day (Approx 4:00 AM IST / 6:30 PM EST)
    - cron: '30 22 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub website

jobs:
  build_and_upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore YouTube Tokens from Secrets
      run: |
        # The tokens are stored securely in GitHub Secrets and created at runtime
        echo "${{ secrets.TOKEN_JSON }}" > token.json
        echo "${{ secrets.TOKEN_NEXVORA }}" > token_nexvora.json
        echo "${{ secrets.CLIENT_SECRETS }}" > client_secrets.json

    - name: Run Cloud Automation
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        IG_CR7_USER: ${{ secrets.IG_CR7_USER }}
        IG_CR7_PASS: ${{ secrets.IG_CR7_PASS }}
        IG_TECH_USER: ${{ secrets.IG_TECH_USER }}
        IG_TECH_PASS: ${{ secrets.IG_TECH_PASS }}
      run: |
        python cloud_runner.py
