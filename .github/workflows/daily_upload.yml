name: Daily AI YouTube Uploader

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  build_and_upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore YouTube Tokens from Secrets
      run: |
        echo "${{ secrets.TOKEN_JSON }}" > token.json
        echo "${{ secrets.TOKEN_NEXVORA }}" > token_nexvora.json
        echo "${{ secrets.CLIENT_SECRETS }}" > client_secrets.json

    - name: Run Cloud Automation
      run: |
        python cloud_runner.py
